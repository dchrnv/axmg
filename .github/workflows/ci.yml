name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (Rust + Python E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Run Rust unit tests (118 tests)
        run: cargo test --workspace --verbose

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Run Phase 1 & 2 E2E validation
        run: python3 verify_phase1.py

      - name: Run Phase 3 Sensory streamer validation
        run: python3 verify_sensory.py

      - name: Run Phase 4 LLM Context E2E validation
        run: python3 verify_phase4_e2e.py
