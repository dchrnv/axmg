[package]
name = "axmg"
version = "0.1.0"
edition = "2024"
description = "Deterministic Merkle DAG associative memory engine"
license = "AGPL-3.0"
repository = "https://github.com/dchrnv/axmg"
homepage = "https://github.com/dchrnv/axmg"
documentation = "https://docs.rs/axmg"
readme = "README.md"
keywords = ["memory", "merkle", "associative", "llm", "compression"]
categories = ["data-structures", "algorithms"]

[dependencies]
sha2 = "0.10"
blake2 = "0.10"
redb = "4.1.0"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
