name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Package crate
        run: cargo package -p axmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "axmg ${{ github.ref_name }}"
          generate_release_notes: true
          files: target/package/*.crate
          body: |
            ### 🚀 axmg ${{ github.ref_name }} — Universal Merkle DAG Associative Memory Engine

            - **crates.io:** [https://crates.io/crates/axmg](https://crates.io/crates/axmg)
            - **docs.rs:** [https://docs.rs/axmg](https://docs.rs/axmg)

            #### Quickstart
            ```toml
            [dependencies]
            axmg = "0.1.0"
            ```

            ```rust
            use axmg::Axmg;

            fn main() -> Result<(), Box<dyn std::error::Error>> {
                let mut memory = Axmg::in_memory();
                let report = memory.ingest("Rust and Merkle DAG combine to build axmg")?;
                println!("Revolution: {}, Surprise: {:.3}", report.revolution, report.surprise_score);
                Ok(())
            }
            ```
