[package]
name = "mcp"
version = "0.1.0"
edition = "2021"
default-run = "axmg-mcp"

[lib]
name = "mcp"
path = "src/lib.rs"

[[bin]]
name = "axmg-mcp"
path = "src/main.rs"

[[bin]]
name = "axmg-sensory-mcp"
path = "src/sensory_main.rs"

[dependencies]
shelf = { path = "../shelf" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
